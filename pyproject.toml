[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cnpj-auditor"
version = "0.1.0"
description = "Local audit of Brazilian company identifiers in CSV exports"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[project.scripts]
cnpj-auditor = "cnpj_auditor.__main__:main"

[tool.setuptools]
packages = ["cnpj_auditor"]
